<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyBrief - Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>SkyBrief</h1>
    <form id="search-form">
      <input type="text" id="city-input" placeholder="Enter a city" required>
      <button type="submit">Search</button>
    </form>
    <p id="status"></p>
    <section id="weather" class="card hidden">
      <h2 id="city-name"></h2>
      <p id="temp"></p>
      <p id="wind"></p>
      <p id="humidity"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
